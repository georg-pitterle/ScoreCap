name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a release PR open. Merging it is what cuts a release: it bumps the
  # version, writes the changelog, tags and creates the GitHub release.
  #
  # The release is created as a draft (see release-please-config.json) and
  # only published by the build job once its packages are attached. Otherwise
  # it is public as the newest version for the minutes the build takes, without
  # the update feed: an installed copy starting in that window finds nothing,
  # and a failed build leaves an empty release behind.
  #
  # Needs a one-off repository setting on top of the permissions below:
  # Settings -> Actions -> General -> Workflow permissions ->
  # "Allow GitHub Actions to create and approve pull requests".
  # Without it the step fails with "GitHub Actions is not permitted to create
  # or approve pull requests", however the workflow permissions are declared.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in the same workflow on purpose: a tag created with GITHUB_TOKEN does
  # not trigger other workflows, so an `on: release` job would never start.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Build bundle
        run: pyinstaller ScoreCap.spec --noconfirm

      - name: Self-test the bundle
        # Proves the packaged app really works - PyMuPDF data files, Pillow and
        # the Qt platform plugins - instead of only that the exe exists.
        #
        # Start-Process -Wait, because ScoreCap.exe is a windowed application:
        # PowerShell does not wait for those and would read the report before
        # it exists. timeout-minutes guards the other half of being windowed -
        # an unexpected dialog would block rather than fail.
        timeout-minutes: 5
        run: |
          $run = Start-Process -FilePath .\dist\ScoreCap\ScoreCap.exe `
            -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($run.ExitCode -ne 0) { throw "self-test failed with $($run.ExitCode)" }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Fetch the previous release
        # Only with the previous release present can vpk build a delta package.
        # There is none for the very first release, which is not an error.
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack
          --packId ScoreCap
          --packTitle ScoreCap
          --packAuthors georg-pitterle
          --packVersion ${{ needs.release-please.outputs.version }}
          --packDir dist\ScoreCap
          --mainExe ScoreCap.exe
          --icon assets\scorecap.ico

      - name: Attach the packages to the release
        # release-please already created the release, so the files are uploaded
        # to it rather than letting vpk create a second one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem Releases -File | ForEach-Object { $_.FullName }
          gh release upload ${{ needs.release-please.outputs.tag_name }} $files --clobber

      - name: Publish the release
        # Last step on purpose: installed copies see the new version only now,
        # when everything they need to update is already there.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ needs.release-please.outputs.tag_name }} --draft=false --latest
