name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows, because hotkey.py talks to the Win32 API and the Qt tests need
    # the same platform the app ships on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
