name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The release PR only touches these files. Without the filter CI starts on
    # it and GitHub holds the run ("This workflow is awaiting approval from a
    # maintainer"), because github-actions[bot] opened the PR. A job condition
    # does not help - the hold comes before it is evaluated; only a filter on
    # the trigger keeps the run from existing. The release workflow runs the
    # suite again before it packages anything.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - scorecap/_version.py

jobs:
  test:
    # Windows, because hotkey.py talks to the Win32 API and the Qt tests need
    # the same platform the app ships on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
