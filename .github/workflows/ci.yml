name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Skip the release PR. It only carries a version bump and the changelog,
    # and the release workflow runs the suite again before it packages
    # anything. GitHub also holds workflows from github-actions[bot] pull
    # requests for manual approval, so this avoids a pointless click per
    # release. On push head_ref is empty and the job runs as usual.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    # Windows, because hotkey.py talks to the Win32 API and the Qt tests need
    # the same platform the app ships on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
