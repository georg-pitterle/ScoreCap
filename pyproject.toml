[project]
name = "scorecap"
version = "0.1.0"
description = "Capture screen regions and tile them onto A4 pages as PDF"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "PyMuPDF>=1.24",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
scorecap = "scorecap.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scorecap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
