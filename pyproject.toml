[project]
name = "scorecap"
version = "0.5.0"
description = "Capture screen regions and tile them onto A4 pages as PDF"
requires-python = ">=3.11"
dependencies = [
    # Essentials only: the app uses QtCore, QtGui and QtWidgets. The addons
    # (WebEngine, 3D, Multimedia, Charts) would only bloat the bundle.
    "PySide6-Essentials",
    "PyMuPDF>=1.24",
    "Pillow",
    "velopack",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pytest-xdist", "pyinstaller"]

[project.scripts]
scorecap = "scorecap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scorecap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is Qt-heavy and runs offscreen: spreading it over the cores
# costs nothing and turns half a minute into a few seconds.
addopts = "-n auto"
